name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore Dependencies
      run: dotnet restore IcecastStreamMonitor.slnx

    - name: Run Unit Tests
      run: dotnet test IcecastStreamMonitor.slnx --configuration Release --no-restore

    - name: Publish Host Application
      run: |
        dotnet publish IcecastStreamMonitor/IcecastStreamMonitor.csproj -c Release -r win-x64 --self-contained false -o ./publish

    - name: Publish Remote Control Client
      run: |
        dotnet publish IcecastStreamMonitor.RemoteControl/IcecastStreamMonitor.RemoteControl.csproj -c Release -r win-x64 --self-contained false -o ./remote-publish
        Copy-Item -Path ./remote-publish/IcecastStreamMonitor.RemoteControl.exe -Destination ./publish/RTSAS-RemoteControl.exe

    - name: Publish Installer Wizard & Bundle
      run: |
        dotnet publish IcecastStreamMonitor.Installer/IcecastStreamMonitor.Installer.csproj -c Release -r win-x64 --self-contained false -o ./installer-publish
        Copy-Item -Path ./publish/* -Destination ./installer-publish/ -Recurse -Force
        Copy-Item -Path ./installer-publish/IcecastStreamMonitor.Installer.exe -Destination ./RTSAS-Setup-Installer.exe
        Copy-Item -Path ./remote-publish/IcecastStreamMonitor.RemoteControl.exe -Destination ./RTSAS-RemoteControl.exe
        Compress-Archive -Path ./installer-publish/* -DestinationPath ./RTSAS-Full-Package.zip

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          ./RTSAS-Setup-Installer.exe
          ./RTSAS-RemoteControl.exe
          ./RTSAS-Full-Package.zip
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
