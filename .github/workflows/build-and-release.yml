name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore Dependencies
      run: dotnet restore IcecastStreamMonitor.slnx

    - name: Run Unit Tests
      run: dotnet test IcecastStreamMonitor.slnx --configuration Release --no-restore

    - name: Publish Standalone Executables
      run: |
        dotnet publish IcecastStreamMonitor/IcecastStreamMonitor.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o ./single-publish/main
        dotnet publish IcecastStreamMonitor.RemoteControl/IcecastStreamMonitor.RemoteControl.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o ./single-publish/remote
        dotnet publish IcecastStreamMonitor.Installer/IcecastStreamMonitor.Installer.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o ./single-publish/installer

    - name: Package Release Assets
      run: |
        $tag = "${{ github.ref_name }}"
        if (-not $tag -or $tag -eq "") { $tag = "v1.0.1" }
        Copy-Item -Path ./single-publish/installer/IcecastStreamMonitor.Installer.exe -Destination "./RTSAS-Setup-Installer-$tag.exe"
        Copy-Item -Path ./single-publish/remote/IcecastStreamMonitor.RemoteControl.exe -Destination "./RTSAS-RemoteControl-$tag.exe"
        Compress-Archive -Path ./single-publish/installer/IcecastStreamMonitor.Installer.exe,./single-publish/main/IcecastStreamMonitor.exe,./single-publish/remote/IcecastStreamMonitor.RemoteControl.exe -DestinationPath "./RTSAS-Full-Package-$tag.zip"

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          ./RTSAS-Setup-Installer-*.exe
          ./RTSAS-RemoteControl-*.exe
          ./RTSAS-Full-Package-*.zip
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  real-codec-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    - name: Install independent FFmpeg
      run: |
        if ! command -v ffmpeg >/dev/null; then
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
        fi
        ffmpeg -version | sed -n '1p'
    - name: Build isolated loopback host
      run: dotnet build ContinuityLab/ContinuityLab.csproj -c Release
    - name: Decode AAC-LC, HE-AACv2 and Ogg FLAC across source handoffs
      shell: bash
      run: |
        set -o pipefail
        python3 ContinuityLab/codec_handoff.py ContinuityLab/bin/Release/net10.0/ContinuityLab.dll | tee codec-handoff-result.jsonl
    - name: Retain codec test result
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: synthetic-codec-handoff
        path: codec-handoff-result.jsonl
        if-no-files-found: warn
